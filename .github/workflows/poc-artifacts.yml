# Builds proof-of-concept multi-boot ISOs (per-env layout + cross-env-dedup
# layout) and publishes them to Cloudflare R2.
#
# Uses the org-wide R2 secrets and the same rclone pattern as the other
# tuna-os ISO repos (dakota-iso, ubuntu-26.04-iso):
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET
# Artifacts land flat under the repo's prefix in the shared bucket:
#   <bucket>/tacklebox/<name>-<YYYYMMDD>-<sha7>.iso   immutable, per-run
#   <bucket>/tacklebox/<name>-latest.iso              rolling latest
# Published at https://download.tunaos.org/tacklebox/<name>-latest.iso
#
# Upload is skipped on PRs, on the skip_upload dry-run input, and on forks
# where R2_BUCKET is unset — the build + verify still run in all cases.
name: poc-artifacts

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: >-
          Optional recipe path to build instead of the fixture PoC pair.
          Images must be pullable from a registry (and live-bootable:
          dracut installed, or skip_initramfs_rebuild with a prepared
          initramfs).
        required: false
        default: ""
      skip_upload:
        description: 'Build ISOs but skip uploading to R2 (dry run)'
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly, Monday 05:00 UTC — keeps the PoC artifacts fresh against
    # upstream image updates without burning runners daily.
    - cron: '0 5 * * 1'

concurrency:
  group: poc-artifacts
  cancel-in-progress: true

jobs:
  build-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Mapped to env so the upload step's `if:` can detect a fork with no
      # secrets (secrets aren't available in job-level `if:` directly).
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main as of 2026-06-09
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso mtools squashfs-tools dosfstools \
            systemd-boot systemd-boot-efi podman rclone

      - name: build tacklebox
        run: go build -o tacklebox ./cmd/tacklebox

      # The caches only pay off for registry-image recipes (stable image
      # IDs between runs); the fixture images are rebuilt per run and miss.
      # Restoring a stale snapshot is harmless either way.
      - name: prepare output base for cache restore
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/tbx

      - name: restore build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /mnt/tbx/initramfs-cache
            /mnt/tbx/squashfs-cache
          key: tbox-poc-cache-${{ github.run_id }}
          restore-keys: |
            tbox-poc-cache-

      # ── Default PoC: the fixture pair, both layouts ─────────────────────
      - name: build fixture live images
        if: inputs.recipe == ''
        run: |
          podman build -f fixtures/iso-smoke.Containerfile \
            --build-arg MARKER=alpha -t localhost/tbox-iso-alpha:latest fixtures
          podman build -f fixtures/iso-smoke.Containerfile \
            --build-arg MARKER=beta -t localhost/tbox-iso-beta:latest fixtures

      - name: build PoC ISOs (per-env + dedup layouts)
        if: inputs.recipe == ''
        run: |
          sudo ./tacklebox build fixtures/iso-2env.json \
            --iso /mnt/tbx/tacklebox-poc-perenv.iso -b /mnt/tbx
          sudo ./tacklebox build fixtures/iso-dedup-2env.json \
            --iso /mnt/tbx/tacklebox-poc-dedup.iso -b /mnt/tbx

      # ── Custom PoC: a caller-supplied recipe ────────────────────────────
      - name: build PoC ISO (custom recipe)
        if: inputs.recipe != ''
        env:
          RECIPE: ${{ inputs.recipe }}
        run: |
          sudo ./tacklebox build "${RECIPE}" \
            --iso /mnt/tbx/tacklebox-poc-custom.iso -b /mnt/tbx

      - name: verify ISOs
        run: |
          for iso in /mnt/tbx/*.iso; do
            ./tacklebox verify "$iso"
          done

      - name: checksums
        run: |
          cd /mnt/tbx
          sha256sum ./*.iso > SHA256SUMS
          cat SHA256SUMS

      - name: upload to R2
        if: ${{ inputs.skip_upload != true && github.event_name != 'pull_request' && env.R2_BUCKET != '' }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          STAMP="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          PREFIX="R2:${R2_BUCKET}/tacklebox"
          {
            echo "## PoC artifacts uploaded to R2"
          } >> "$GITHUB_STEP_SUMMARY"
          for iso in /mnt/tbx/*.iso; do
            base=$(basename "$iso" .iso)
            echo "==> Uploading ${base} (dated + latest) ..."
            rclone copyto --log-level INFO --checksum --s3-no-check-bucket \
              "$iso" "${PREFIX}/${base}-${STAMP}.iso"
            rclone copyto --log-level INFO --s3-no-check-bucket \
              "$iso" "${PREFIX}/${base}-latest.iso"
            echo "- https://download.tunaos.org/tacklebox/${base}-latest.iso" >> "$GITHUB_STEP_SUMMARY"
          done
          rclone copyto --log-level INFO --s3-no-check-bucket \
            /mnt/tbx/SHA256SUMS "${PREFIX}/SHA256SUMS-${STAMP}"

      - name: note skipped upload
        if: ${{ inputs.skip_upload == true || github.event_name == 'pull_request' || env.R2_BUCKET == '' }}
        run: |
          echo '## R2 upload skipped (dry run, PR, or R2 secrets unset)' >> "$GITHUB_STEP_SUMMARY"

      - name: artifact summary
        if: always()
        run: |
          echo '## PoC ISO builds' >> "$GITHUB_STEP_SUMMARY"
          ls -lh /mnt/tbx/*.iso 2>/dev/null | awk '{print "- `" $NF "` (" $5 ")"}' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /mnt/tbx/SHA256SUMS ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /mnt/tbx/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
