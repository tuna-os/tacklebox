---
name: Release container image

# Publish a tacklebox container image to ghcr.io so downstream consumers
# (notably tuna-os/tunaos's scripts/build-iso-tacklebox.sh) don't have to
# clone+build from source. Two-stage Containerfile builds a stripped Go
# binary onto a minimal Fedora runtime with sgdisk / mkfs / bootc / podman
# / xorriso / xz pre-installed.

"on":
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Containerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'src/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/release-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          # Branch push (main): tag with :latest + short SHA so renovate can
          # pin to a specific commit. Tag push: also tag with the version.
          IMAGE="ghcr.io/${{ github.repository_owner }}/tacklebox"
          TAGS="${IMAGE}:latest"
          TAGS="${TAGS},${IMAGE}:sha-$(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Annotations land in the OCI image manifest so `podman inspect`
          # shows the source repo, license, etc.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "## Tacklebox image published"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.tags.outputs.image }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Tags | \`${{ steps.tags.outputs.tags }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
