---
name: Release container image

# Publish a tacklebox container image to ghcr.io so downstream consumers
# (notably tuna-os/tunaos's scripts/build-iso-tacklebox.sh) don't have to
# clone+build from source. Two-stage Containerfile builds a stripped Go
# binary onto a minimal Fedora runtime with sgdisk / mkfs / bootc / podman
# / xorriso / xz pre-installed.

"on":
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Containerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'src/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/release-image.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-image-${{ inputs.tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          # Branch push (main): tag with :latest + short SHA so renovate can
          # pin to a specific commit. Tag push: also tag with the version.
          IMAGE="ghcr.io/${{ github.repository_owner }}/tacklebox"
          TAGS="${IMAGE}:latest"
          TAGS="${TAGS},${IMAGE}:sha-$(git rev-parse --short HEAD)"
          TAG="${RELEASE_TAG}"
          if [[ -n "$TAG" ]]; then
            TAGS="${TAGS},${IMAGE}:${TAG#v}"
            TAGS="${TAGS},${IMAGE}:${TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Annotations land in the OCI image manifest so `podman inspect`
          # shows the source repo, license, etc.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "## Tacklebox image published"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Tags | \`${TAGS}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
