# Builds the Bazzite GNOME multi-boot ISO (AMD/Intel, Nvidia, Deck) and publishes to Cloudflare R2.
# Published at https://download.tunaos.org/tacklebox/bazzite-gnome-latest.iso
name: bazzite-gnome

on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build ISO but skip uploading to R2 (dry run)'
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly, Wednesday 07:00 UTC (staggered 2h after KDE build)
    - cron: '0 7 * * 3'

concurrency:
  group: bazzite-gnome
  cancel-in-progress: true

jobs:
  build-bazzite-gnome:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # The job's tacklebox output base; ci-cleanup removes only what is
      # claimed under it (and /mnt/iso-out) by this job.
      TBX_CI_OUT: /var/tmp/tbx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main as of 2026-06-09
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso mtools squashfs-tools dosfstools \
            systemd-boot systemd-boot-efi podman rclone

      - name: build tacklebox
        run: just build

      # /var/tmp/tbx: build intermediates (squashfs, initramfs, iso tree)
      # /mnt/iso-out: final ISO destination (freed ~14 GiB by docker cleanup)
      # Claiming also writes the ownership marker ci-cleanup requires.
      - name: prepare output dirs
        run: just ci-claim /var/tmp/tbx /mnt/iso-out

      - name: restore build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /var/tmp/tbx/initramfs-cache
            /var/tmp/tbx/squashfs-cache
          key: tbox-bazzite-gnome-cache-${{ github.run_id }}
          restore-keys: |
            tbox-bazzite-gnome-cache-

      - name: pre-pull images
        run: just ci-pull-recipe-images examples/bazzite-gnome.json 3

      - name: build Bazzite GNOME ISO
        run: just ci-example-iso-build bazzite-gnome

      - name: verify ISO
        run: just ci-example-iso-verify bazzite-gnome

      - name: checksums
        run: just ci-isos-checksum /mnt/iso-out bazzite-gnome.iso

      - name: upload to R2
        if: ${{ inputs.skip_upload != true && github.event_name != 'pull_request' && env.R2_BUCKET != '' }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          STAMP="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          PREFIX="R2:${R2_BUCKET}/tacklebox"
          {
            echo "## Bazzite GNOME ISO uploaded to R2"
          } >> "$GITHUB_STEP_SUMMARY"
          rclone copyto --log-level INFO --checksum --s3-no-check-bucket \
            /mnt/iso-out/bazzite-gnome.iso "${PREFIX}/bazzite-gnome-${STAMP}.iso"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            /mnt/iso-out/bazzite-gnome.iso "${PREFIX}/bazzite-gnome-latest.iso"
          echo "- https://download.tunaos.org/tacklebox/bazzite-gnome-latest.iso" >> "$GITHUB_STEP_SUMMARY"
          rclone copyto --log-level INFO --s3-no-check-bucket \
            /mnt/iso-out/SHA256SUMS "${PREFIX}/bazzite-gnome-SHA256SUMS-${STAMP}"

      - name: note skipped upload
        if: ${{ inputs.skip_upload == true || github.event_name == 'pull_request' || env.R2_BUCKET == '' }}
        run: |
          echo '## R2 upload skipped (dry run, PR, or R2 secrets unset)' >> "$GITHUB_STEP_SUMMARY"

      - name: artifact summary
        if: always()
        run: just ci-summary-isos 'Bazzite GNOME ISO build' /mnt/iso-out

      # Last step, always: remove the pulled images, containers and the ISO
      # THIS job created (ownership-scoped; the build caches are kept).
      - name: cleanup (job-owned images, mounts, scratch)
        if: always()
        run: just ci-cleanup /mnt/iso-out
