name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: '~> v2'
          args: ${{ (inputs.tag != '' || startsWith(github.ref, 'refs/tags/')) && 'release --skip=publish --clean' || 'release --snapshot --skip=publish --clean' }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: goreleaser-artifacts
          path: |
            dist/*.tar.gz
            dist/*_checksums.txt
          if-no-files-found: error
          retention-days: 1

  release:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Download binary artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: goreleaser-artifacts
          path: dist
      - name: Verify release inputs
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          for checksum in *_checksums.txt; do
            sha256sum --check "$checksum"
          done
          test -f "../docs/releases/${RELEASE_TAG}.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "Tacklebox ${RELEASE_TAG}" \
              --notes-file "docs/releases/${RELEASE_TAG}.md"
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*_checksums.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
