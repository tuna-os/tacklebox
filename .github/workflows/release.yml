name: Release binaries
# Prebuilt static binaries per tag so consumers stop compiling tacklebox
# from source in every CI job (tuna-os/tacklebox#86 item 2).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -ldflags "-s -w" -o "tacklebox-linux-${GOARCH}" ./cmd/tacklebox
          sha256sum "tacklebox-linux-${GOARCH}" > "tacklebox-linux-${GOARCH}.sha256"
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" tacklebox-linux-* --clobber || gh release create "$GITHUB_REF_NAME" tacklebox-linux-* --generate-notes
      - name: Upload artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tacklebox-linux-${{ matrix.goarch }}
          path: tacklebox-linux-*
