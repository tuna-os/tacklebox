name: cross-platform disk smoke

# tuna-os/tacklebox#109's original plan was a full loopback build→verify→
# add→remove cycle on windows-latest/macos-latest, mirroring the Linux
# verify-smoke job. That assumed the write path stayed inside tacklebox
# itself. It didn't: tuna-os/iso-builder#107/#108 moved the actual macOS/
# Windows write orchestration into iso-builder/native (a bundled QEMU VM
# on macOS, WSL2 on Windows) — tacklebox's own code on non-Linux is just
# enumeration/filtering (pkg/blockdev/darwin), already unit-tested and
# platform-independent of any live device.
#
# A full VM-boot-and-bootc-install run (what iso-builder's exec_darwin.go
# actually does) is real work only proven live on real hardware so far —
# GitHub's macos-latest runners have no hardware acceleration for an
# x86_64 guest (this needs QEMU TCG regardless of host, see #108's
# research on Apple Silicon, but a CI VM adds its own nested-virtualization
# uncertainty on top), so doing that full cycle in CI risks either not
# working at all or blowing well past a sane job timeout. What's realistic
# and actually valuable here: prove the underlying OS primitives this
# whole approach depends on (hdiutil on macOS, diskpart/Win32_DiskDrive on
# Windows) work on GitHub-hosted runners, and run pkg/blockdev/darwin's
# tests compiled natively for darwin — previously only ever cross-compiled
# from Linux (GOOS=darwin without a macOS toolchain can type-check but
# never actually execute a test binary).

# Path-filtered: nothing here reads anything but the darwin blockdev package,
# the just recipes, the Go toolchain pin and this file, and no job in this
# workflow is a required check, so a run that never starts blocks nothing.
# The weekly run keeps watching the runner images, which can drift with no
# commit in this repository.
on:
  push:
    branches: [main]
    paths:
      - pkg/blockdev/**
      - justfile
      - go.mod
      - go.sum
      - .github/workflows/cross-platform-smoke.yml
  pull_request:
    paths:
      - pkg/blockdev/**
      - justfile
      - go.mod
      - go.sum
      - .github/workflows/cross-platform-smoke.yml
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

# Supersede stale PR runs to keep the shared runner pool available.
# Every push, schedule, or manual run needs its own verdict: a shared group
# can evict pending runs even when cancel-in-progress is false.
concurrency:
  group: cross-platform-smoke-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-disk-primitives:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@v4.0.0  # zizmor: ignore[unpinned-tools] installs the latest just release, as before; a pinned version would have no updater

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # Real execution, not just cross-compiled type-checking: this is the
      # first time pkg/blockdev/darwin's tests have actually run on darwin.
      - name: run pkg/blockdev/darwin tests natively
        run: just test-darwin

      # The recipe detaches and removes the image on every exit path, so a
      # failed diskutil assertion cannot leak the attached device.
      - name: hdiutil create + attach a virtual disk (the CI-testable proxy from #106's research)
        run: just ci-macos-disk-smoke

  windows-disk-primitives:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: diskpart create + attach + format a virtual disk (the CI-testable proxy from #109's original research)
        shell: pwsh
        run: |
          $script = @"
          create vdisk file=C:\tboxci.vhdx maximum=64 type=expandable
          select vdisk file=C:\tboxci.vhdx
          attach vdisk
          create partition primary
          format fs=fat32 quick
          assign
          "@
          $script | Out-File -Encoding ascii C:\tboxci-diskpart.txt
          diskpart /s C:\tboxci-diskpart.txt

      - name: Win32_DiskDrive query (the exact query iso-builder/native/blockdev_windows.go uses)
        shell: pwsh
        run: Get-CimInstance Win32_DiskDrive | Select-Object DeviceID,Model,Size,InterfaceType,MediaType | ConvertTo-Json

      # Always: detach the virtual disk this job attached and remove its files.
      # Only the paths created above are touched. Exits 0 when nothing exists.
      - name: detach virtual disk
        if: always()
        shell: pwsh
        run: |
          if (Test-Path C:\tboxci.vhdx) {
            "select vdisk file=C:\tboxci.vhdx`ndetach vdisk" | Out-File -Encoding ascii C:\tboxci-detach.txt
            diskpart /s C:\tboxci-detach.txt
          }
          Remove-Item -Force -ErrorAction SilentlyContinue C:\tboxci.vhdx, C:\tboxci-diskpart.txt, C:\tboxci-detach.txt
          exit 0
